name: Publish repository courses

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-repository-courses
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Skip superseded commits
        id: current
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit is available; this run will not publish."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for frontend deployment of this commit
        if: steps.current.outputs.yes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'main.yml',
                head_sha: sha,
                per_page: 20,
              });
              const run = data.workflow_runs.find(item => item.event === 'push' && item.head_branch === 'main');
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') core.setFailed(`Frontend deployment failed: ${run.conclusion}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 20000));
            }
            core.setFailed('Timed out waiting for the frontend deployment of this commit.');

      - name: Confirm commit is still current
        id: latest
        if: steps.current.outputs.yes == 'true'
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit is available; this run will not publish."
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.latest.outputs.yes == 'true'
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.yes == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install server dependencies
        if: steps.latest.outputs.yes == 'true'
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Check publishing secret
        if: steps.latest.outputs.yes == 'true'
        env:
          DATABASE_URL: ${{ secrets.COURSE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Set the COURSE_DATABASE_URL repository secret to publish opted-in courses."
            exit 1
          fi

      - name: Apply database migrations
        if: steps.latest.outputs.yes == 'true'
        working-directory: server
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.COURSE_DATABASE_URL }}
        run: pnpm exec prisma migrate deploy

      - name: Publish approved course packages
        if: steps.latest.outputs.yes == 'true'
        working-directory: server
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.COURSE_DATABASE_URL }}
        run: pnpm courses:publish
