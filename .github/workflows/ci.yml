name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buildment
          POSTGRES_PASSWORD: buildment
          POSTGRES_DB: buildment
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buildment -d buildment"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://buildment:buildment@localhost:5432/buildment
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # postinstall builds shared/ and generates the Prisma client.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @buildment/server exec prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm --filter @buildment/shared --filter @buildment/server lint
      # The web app still carries pre-existing react-hooks lint findings; report, do not block.
      - run: pnpm --filter @buildment/frontend lint
        continue-on-error: true
      - run: pnpm --filter @buildment/shared test
      - run: pnpm --filter @buildment/server test
      - run: pnpm --filter @buildment/frontend test
      - run: pnpm --filter @buildment/server build
      - run: pnpm --filter @buildment/frontend build

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
