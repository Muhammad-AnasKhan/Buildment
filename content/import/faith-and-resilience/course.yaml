slug: faith-and-resilience
title: "Steady Hearts: Islamic Belief for Uncertain Times"
description: "Stay steady and act well when the future is unclear. Learn what Islamic belief teaches about the unseen, qadr and effort, tawakkul with taking the means, sabr through loss and waiting, gratitude and hope, deciding with shura and istikhara, sincere intention and good work, starting again after failure, and serving others. Every module is practice with everyday cases from study, freelance work and family life, with every verse and hadith referenced."
projectGoal: "Build a steady plan for one uncertain situation in your life, or a provided case: what is in your control and what is not, the means you will take and your backup, the people you will consult, the dua and weekly rhythm you will keep, and what you will do if it does not work out. Then walk a mentor through it in five minutes."
difficulty: Beginner
estimatedHours: 16
category: soft-skills
modules:
  - dir: 01-anchors-when-the-future-is-unclear
    title: "Anchors when the future is unclear"
    summary: "Separate what you know and can do from what only Allah knows, see life's tests as part of a purpose, and hold belief in qadr together with full effort."
    lessons:
      - file: 01.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce the course through one fellow's week of uncertainty: a silent client, a pending scholarship and a power cut."
      - file: 01.02-what-only-allah-knows.md
        title: "What you know and what only Allah knows"
        goal: "Sort an uncertain situation into what only Allah knows and decides, and the next step that is yours to take."
      - file: 01.03-life-as-a-test.md
        title: "Life as a test, with a purpose"
        goal: "Explain how the Quran describes life as a test with a purpose, why hardship is not a sign of Allah's anger, and how that changes the way a believer reads a hard week."
      - file: 01.04-qadr-and-effort.md
        title: "Qadr and effort together"
        goal: "Explain why belief in qadr does not cancel effort, using the Prophet's answer 'Act', and drop the habit of 'if only'."
      - file: 01.05-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: sort one real or provided uncertain situation into what is yours to do and what you leave with Allah, with your next step."
  - dir: 02-tawakkul
    title: "Tawakkul: trust Allah and take the means"
    summary: "Learn what tawakkul is and is not: full trust in Allah together with real planning, backup plans and effort, as the Prophet, peace be upon him, planned the Hijra."
    lessons:
      - file: 02.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce tawakkul through a fellow preparing for a remote job interview with an unreliable connection."
      - file: 02.02-what-tawakkul-is.md
        title: "What tawakkul is, and what it is not"
        goal: "Explain tawakkul as reliance of the heart on Allah together with taking the means, and spot the two ways it goes wrong."
      - file: 02.03-tie-it-and-trust.md
        title: "Tie it and trust"
        goal: "Plan the means for a goal, including a backup plan, and see in Hajar's search for water why full effort is part of trust, not a lack of it."
      - file: 02.04-the-prophets-planning.md
        title: "The Prophet's planning in the Hijra"
        goal: "Follow the planned steps of the Hijra and the trust behind them, and apply the same pattern to a plan of your own."
      - file: 02.05-quiz.md
        title: "Tawakkul and taking the means"
        goal: "Graded cases on trust with effort, backup plans and the two ways tawakkul goes wrong."
      - file: 02.06-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: a means plan with a backup for one real or provided goal."
  - dir: 03-sabr
    title: "Sabr: patience that keeps moving"
    summary: "See sabr as steadiness that keeps acting, not silence or giving up. Learn the words the Sunnah teaches for hard moments, and how to wait well, with Yaqub, Yusuf and Yunus, peace be upon them."
    lessons:
      - file: 03.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce sabr through a fellow who did not get a scholarship she worked a year for."
      - file: 03.02-what-sabr-is.md
        title: "What sabr is, and what it is not"
        goal: "Explain sabr as steadiness at the first shock that keeps acting, and tell it apart from silence, giving up and hiding need."
      - file: 03.03-words-for-hard-moments.md
        title: "Words for hard moments"
        goal: "Use the words and duas the Quran and Sunnah teach at a loss or in distress, and know that grief and tears are human."
      - file: 03.04-waiting-well.md
        title: "Waiting well"
        goal: "Wait well for a result you cannot control: keep working, keep hope, and turn to Allah, as Yaqub, Yusuf and Yunus did."
      - file: 03.05-quiz.md
        title: "Sabr"
        goal: "Graded cases on sabr, grief, duas at hard moments and waiting well."
      - file: 03.06-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: a plan for waiting well through one real or provided wait."
  - dir: 04-gratitude-and-hope
    title: "Gratitude and hope"
    summary: "Practise shukr in words, in the heart and in action, and keep hope and fear in balance, so that neither despair nor carelessness takes over."
    lessons:
      - file: 04.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce gratitude and hope through a fellow who feels left behind when he compares himself with others online."
      - file: 04.02-gratitude-you-can-practise.md
        title: "Gratitude you can practise"
        goal: "Practise shukr in the heart, the tongue and action, look at those with less, and thank the people who help you."
      - file: 04.03-hope-and-fear-in-balance.md
        title: "Hope and fear in balance"
        goal: "Keep hope in Allah's mercy and care about your actions together, and recognise despair and carelessness as the two ways the balance breaks."
      - file: 04.04-quiz.md
        title: "Gratitude and hope"
        goal: "Graded cases on practising shukr and on keeping hope and fear in balance."
      - file: 04.05-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: a one-week gratitude and hope practice, with what you noticed."
  - dir: 05-deciding-when-the-outcome-is-unclear
    title: "Deciding when the outcome is unclear"
    summary: "Make decisions you can live with when you cannot see the end: gather what you can know, consult people who know (shura), pray istikhara, then decide and act with trust."
    lessons:
      - file: 05.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce decisions under uncertainty through a fellow choosing between two job offers."
      - file: 05.02-take-the-means-of-knowing.md
        title: "Take the means of knowing"
        goal: "Gather facts, check that every option is permissible, and see what matters most to you before you decide."
      - file: 05.03-shura.md
        title: "Shura: ask people who know"
        goal: "Consult the right people in the right way, as the Prophet, peace be upon him, consulted his companions and his family."
      - file: 05.04-istikhara.md
        title: "Istikhara: ask Allah to choose for you"
        goal: "Pray istikhara as the Sunnah teaches, know what it is and is not, then decide and act with trust."
      - file: 05.05-quiz.md
        title: "Deciding with shura and istikhara"
        goal: "Graded cases on gathering facts, consulting well, istikhara and acting on a decision."
      - file: 05.06-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: a decision record for one real or provided choice."
  - dir: 06-intention-work-and-starting-again
    title: "Intention, good work and starting again"
    summary: "Turn daily work and study into worship with a sincere intention, do good work a little and often, and start again after a failure without 'if only'."
    lessons:
      - file: 06.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce intention and starting again through a freelancer who missed a deadline and lost a client."
      - file: 06.02-intention.md
        title: "Intention: why you do the work"
        goal: "Set a sincere intention for work and study, and see how it changes what success and failure mean."
      - file: 06.03-good-work-little-and-often.md
        title: "Good work, a little and often"
        goal: "Do work with excellence (ihsan), and keep small, consistent habits that survive bad days."
      - file: 06.04-after-a-failure.md
        title: "After a failure"
        goal: "After a failure, take responsibility, learn what to change, turn back to Allah where you fell short, and start again."
      - file: 06.05-quiz.md
        title: "Intention, good work and starting again"
        goal: "Graded cases on intention, consistency and responding to failure."
      - file: 06.06-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: a fresh start plan after one real or provided setback."
  - dir: 07-community-care-and-your-steady-plan
    title: "Community, care and your steady plan"
    summary: "Serve others and let others help you, care for your body and mind and ask for help when you need it, then bring the whole course together in your steady plan."
    lessons:
      - file: 07.01-set-the-scene.md
        title: "Set the scene"
        goal: "Bring the course together through a study circle of fellows who carry each other through a hard month, and introduce the capstone."
      - file: 07.02-serving-others.md
        title: "Serving others"
        goal: "Serve others as part of faith and see how helping others steadies you too."
      - file: 07.03-caring-for-body-and-mind.md
        title: "Caring for body and mind, and asking for help"
        goal: "Care for your body and mind as a trust, and ask a real person for help, including a professional, as taking the means."
      - file: 07.04-quiz.md
        title: "Mixed review: which teaching fits?"
        goal: "Graded fresh cases that each combine two situations, drawn from across the course (including sorting what is yours to do and asking a real person for help): choose which teaching or practice fits first, and why."
      - file: 07.05-capstone-your-steady-plan.md
        title: "Capstone: your steady plan"
        goal: "Build a steady plan for one real or provided uncertain situation, bringing together control, means, sabr, shukr, shura, istikhara, intention and community."
      - file: 07.06-checklist.md
        title: "Course checklist and your steady toolkit"
        goal: "Gate: final checks, your steady toolkit and a look back at the situation you sorted in module 1."
