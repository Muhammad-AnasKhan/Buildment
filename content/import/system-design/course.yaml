slug: system-design
title: "System Design, Hands On: Build It, Break It, Explain It"
description: "Learn how real systems scale, stay correct and survive failure by playing with live simulations of each idea: push traffic up, kill the leader, cut the network, skew a clock. Write the core algorithms yourself in graded code exercises, build and break small systems in your own system-design-challenges repository, and pass architecture labs where you pick blocks and instance sizes to meet cost, latency and availability targets."
projectGoal: "Design, build, measure and defend one system against stated cost, p99 latency and availability targets: a design document with estimates, a lab design that passes its targets, the core running in your repository with tests, one failure experiment with a chart, and a recorded defence."
difficulty: Advanced
estimatedHours: 191
category: tech
# Modules are added here as they are written, in the order of
# agent-ip/work/system-design/02-curriculum-roadmap.md.
modules:
  - dir: 01-thinking-like-a-system-designer
    title: "Thinking like a system designer"
    summary: "See what system design is, learn the design loop, and set up the repository where you run every experiment."
    lessons:
      - file: 01.01-set-the-scene-launch-day.md
        title: "Set the scene: launch day"
        goal: "Push more and more users onto one server, see where it breaks, and sketch a first fix."
      - file: 01.02-requirements-first.md
        title: "Requirements first"
        goal: "Separate functional requirements, quality requirements and constraints, and find the number that drives the design."
      - file: 01.03-the-building-blocks-map.md
        title: "The building blocks map"
        goal: "Name what each building block is for, and what breaks when it fails."
      - file: 01.04-the-design-loop.md
        title: "The design loop"
        goal: "Run clarify, estimate, sketch, deep dive, trade-offs and failure on a small example."
      - file: 01.05-set-up-your-challenges-repository.md
        title: "Set up your system-design-challenges repository"
        goal: "Create your repository, pass your first test locally and in GitHub Actions, and check that Docker runs."
      - file: 01.06-quiz.md
        title: "Thinking like a system designer"
        goal: "Answer graded scenarios on requirements, building blocks, the design loop and failure."
      - file: 01.07-checklist.md
        title: "Checklist and learning log"
        goal: "Write the requirements and the one driving number for an app you use."
  - dir: 02-numbers-estimation-and-probability
    title: "Numbers, estimation and probability"
    summary: "Feel the numbers that decide designs, and estimate quickly with units."
    lessons:
      - file: 02.01-set-the-scene.md
        title: "Set the scene: will it fit?"
        goal: "See a design fail because nobody did the maths."
      - file: 02.02-latency-numbers-you-should-feel.md
        title: "Latency numbers you should feel"
        goal: "Order memory, SSD, network and cross-continent costs and use them in an argument."
      - file: 02.03-back-of-the-envelope-estimation.md
        title: "Back-of-the-envelope estimation"
        goal: "Go from daily users to peak requests per second, storage per year and bandwidth, with units."
      - file: 02.04-percentiles-and-tail-latency.md
        title: "Percentiles and tail latency"
        goal: "Explain why p99 matters more than the average, and why fan-out makes tails worse."
      - file: 02.05-queues-utilisation-and-littles-law.md
        title: "Queues, utilisation and Little's law"
        goal: "Predict wait time from arrival rate and service rate, and find the knee near full utilisation."
      - file: 02.06-availability-maths.md
        title: "Availability maths: nines, series and parallel"
        goal: "Compute the availability of a chain and of redundant copies, and convert nines to downtime."
      - file: 02.07-code-percentiles-and-availability.md
        title: "Code: percentiles and availability"
        goal: "Implement percentile, seriesAvailability and parallelAvailability and pass the tests."
      - file: 02.08-challenge-1-measure-a-server.md
        title: "Challenge 1: measure a server"
        goal: "Load-test a small Node server in your repository, find its knee, show p50 and p99 in a chart, and check Little's law on your own numbers."
      - file: 02.09-quiz.md
        title: "Numbers and estimation"
        goal: "Answer graded scenarios on latency, estimation, percentiles, queues and availability."
      - file: 02.10-checklist.md
        title: "Checklist and learning log"
        goal: "Write an estimate for a photo-sharing app with the working shown and the driving number marked, and link your challenge 1 results."
  - dir: 03-networking-for-system-designers
    title: "Networking for system designers"
    summary: "Know what a request costs on the wire, how names resolve, and how real-time connections work, plus the Linux basics under every service."
    lessons:
      - file: 03.01-set-the-scene-opening-a-link.md
        title: "Set the scene: what happens when you open a link"
        goal: "Follow one request from the browser to a server and back."
      - file: 03.02-tcp-udp-and-the-cost-of-a-handshake.md
        title: "TCP, UDP and the cost of a handshake"
        goal: "Count round trips for TCP plus TLS 1.2, TLS 1.3 and QUIC, and price them by distance."
      - file: 03.03-dns-and-routing.md
        title: "DNS and routing"
        goal: "Explain resolution, caching, TTLs, anycast and GeoDNS, and why a DNS change is slow to spread."
      - file: 03.04-http-1-1-http-2-and-http-3.md
        title: "HTTP/1.1, HTTP/2 and HTTP/3"
        goal: "Explain head-of-line blocking and what each version fixed."
      - file: 03.05-real-time-connections.md
        title: "Real-time connections: polling, long polling, SSE, WebSockets"
        goal: "Choose a real-time approach by delay, request count and connections per server."
      - file: 03.06-linux-under-your-service.md
        title: "Linux under your service"
        goal: "Explain processes, threads, file descriptors, ports and the event loop, and why one blocking call hurts."
      - file: 03.07-code-a-dns-style-ttl-cache.md
        title: "Code: a DNS-style TTL cache"
        goal: "Implement a resolver cache with TTL and a fake clock."
      - file: 03.08-challenge-2-network-costs.md
        title: "Challenge 2: network costs"
        goal: "Measure handshake and keep-alive costs, and polling versus WebSocket message counts."
      - file: 03.09-quiz.md
        title: "Networking for system designers"
        goal: "Graded scenarios."
      - file: 03.10-checklist.md
        title: "Checklist and learning log"
        goal: "Write a real-time choice for a delivery tracking screen, with numbers."
  - dir: 04-scaling-out-load-balancing-and-statelessness
    title: "Scaling out: load balancing and statelessness"
    summary: "Grow past one server, spread load fairly, and survive a server dying."
    lessons:
      - file: 04.01-set-the-scene-one-server-is-full.md
        title: "Set the scene: one server is full"
        goal: "See why buying a bigger server stops working."
      - file: 04.02-vertical-versus-horizontal-scaling.md
        title: "Vertical versus horizontal scaling"
        goal: "Compare one large instance with many small ones on capacity, cost and failure."
      - file: 04.03-stateless-services-and-where-state-goes.md
        title: "Stateless services and where state goes"
        goal: "Move sessions out of the server and explain the cost of sticky sessions."
      - file: 04.04-load-balancers-l4-l7-and-health-checks.md
        title: "Load balancers: L4, L7 and health checks"
        goal: "Explain what each layer sees and how health checks remove a bad server."
      - file: 04.05-balancing-algorithms.md
        title: "Balancing algorithms"
        goal: "Compare round robin, least connections, power of two choices and hashing under uneven requests."
      - file: 04.06-autoscaling.md
        title: "Autoscaling"
        goal: "Explain scaling signals, warm-up, cooldown and why scaling lags a spike."
      - file: 04.07-code-load-balancing-pickers.md
        title: "Code: load balancing pickers"
        goal: "Implement round robin, least connections and power of two choices and pass the tests."
      - file: 04.08-challenge-3-a-load-balancer.md
        title: "Challenge 3: a load balancer"
        goal: "Build an L7 proxy with health checks, kill a backend and record the p99."
      - file: 04.10-quiz.md
        title: "Scaling out"
        goal: "Answer graded scenarios on sizing for failure, state, health checks, algorithms and routing."
      - file: 04.11-checklist.md
        title: "Checklist and learning log"
        goal: "Write a defence of a three-tier design for 10,000 requests a second."
  - dir: 05-caching-and-cdns
    title: "Caching and CDNs"
    summary: "Make reads cheap without serving wrong data, and keep the database alive when a cache fails."
    lessons:
      - file: 05.01-set-the-scene.md
        title: "Set the scene: the sale that melted the database"
        goal: "See a cache expiry take a database down."
      - file: 05.02-where-caches-live.md
        title: "Where caches live"
        goal: "Place caches from browser to database and add up the latency and database load along the path."
      - file: 05.03-cache-patterns.md
        title: "Cache patterns"
        goal: "Compare cache-aside, read-through, write-through, write-back and write-around, including what each loses on a crash."
      - file: 05.04-eviction-and-hit-rate.md
        title: "Eviction and hit rate"
        goal: "Explain LRU, LFU and TTL, working-set size, and why a small cache can still help."
      - file: 05.05-cache-invalidation.md
        title: "Cache invalidation"
        goal: "Find the stale window for TTL, delete-on-write and versioned keys, including the delete-then-stale-set race."
      - file: 05.06-stampedes-and-hot-keys.md
        title: "Stampedes and hot keys"
        goal: "Stop a thundering herd with request coalescing, a shared lease, stale-while-revalidate and random TTLs."
      - file: 05.07-cdn-and-edge.md
        title: "CDN and edge"
        goal: "Use Cache-Control, origin shield, purge and signed URLs, and predict origin load from hit rate and TTL."
      - file: 05.08-code-an-lru-cache-with-ttl.md
        title: "Code: an LRU cache with TTL"
        goal: "Implement an LRU cache with expiry and an injected clock, and pass the tests."
      - file: 05.09-challenge-4-a-cache-in-front.md
        title: "Challenge 4: a cache in front"
        goal: "Put Valkey in front of a slow database with cache-aside, measure hit rate and stale reads against TTL, and reproduce and fix a stampede."
      - file: 05.11-quiz.md
        title: "Caching and CDNs"
        goal: "Answer graded scenarios on cache placement, invalidation, stampedes, CDN headers and write patterns."
      - file: 05.12-checklist.md
        title: "Checklist and learning log"
        goal: "Write a cache plan for a product page: what, where, TTL and invalidation, and link your challenge 4 results."
  - dir: 06-apis-the-front-door-and-protecting-it
    title: "APIs, the front door and protecting it"
    summary: "Design APIs that are safe to retry, and protect them with gateways, rate limits and authentication."
    lessons:
      - file: 06.01-set-the-scene-a-retry-charged-twice.md
        title: "Set the scene: a retry charged a customer twice"
        goal: "See a timeout plus a retry cause a double charge."
      - file: 06.02-api-styles-rest-grpc-graphql.md
        title: "API styles: REST, gRPC, GraphQL"
        goal: "Choose a style by client, payload and round trips."
      - file: 06.03-good-api-design.md
        title: "Good API design: resources, pagination, versioning, errors"
        goal: "Choose cursor over offset pagination and explain why, version without breaking clients, and write errors a client can act on."
      - file: 06.04-idempotency-and-safe-retries.md
        title: "Idempotency and safe retries"
        goal: "Make a write safe to retry with an idempotency key claimed before the work."
      - file: 06.05-rate-limiting-algorithms.md
        title: "Rate limiting algorithms"
        goal: "Compare token bucket, leaky bucket, fixed window, sliding log and sliding window counter under a burst."
      - file: 06.06-api-gateways.md
        title: "API gateways"
        goal: "Decide what belongs in a gateway: routing, authentication, limits, aggregation, and what stays in the services."
      - file: 06.07-authentication-and-authorization-at-scale.md
        title: "Authentication and authorization at scale"
        goal: "Compare sessions and signed tokens, revocation, OAuth and OIDC roles, and service-to-service authentication."
      - file: 06.08-code-token-bucket-and-sliding-window.md
        title: "Code: token bucket and sliding window"
        goal: "Implement a token bucket and a sliding window counter against a fake clock and pass the tests."
      - file: 06.09-challenge-5-a-rate-limiter.md
        title: "Challenge 5: a rate limiter"
        goal: "Run in-memory limiters, share one limit across two servers in Valkey with an atomic script, and stop double charges with idempotency keys, with your own measurements."
      - file: 06.11-quiz.md
        title: "APIs and the front door"
        goal: "Answer graded scenarios on safe retries, shared rate limits, pagination, token revocation and choosing a limiter."
      - file: 06.12-checklist.md
        title: "Checklist and learning log"
        goal: "Write the API design for a payments endpoint, with idempotency, rate limits and errors, and link your challenge 5 results."
  - dir: 07-databases-and-concurrency-control
    title: "Databases and concurrency control"
    summary: "Choose a database, understand indexes and transactions, and stop two writers from corrupting data."
    lessons:
      - file: 07.01-set-the-scene-two-people-buy-the-last-ticket.md
        title: "Set the scene: two people buy the last ticket"
        goal: "See a lost update sell the last ticket twice."
      - file: 07.02-choosing-a-database.md
        title: "Choosing a database"
        goal: "Match relational, key-value, document, wide-column, time-series, graph and search stores to the way data is read, and sort workloads to the store that fits."
      - file: 07.03-indexes-b-trees-and-lsm-trees.md
        title: "Indexes: B-trees and LSM trees"
        goal: "Explain why an index cuts page reads, why a B-tree changes pages in place while an LSM tree appends and merges later, and where a Bloom filter saves reads."
      - file: 07.04-transactions-and-isolation-levels.md
        title: "Transactions and isolation levels"
        goal: "Wrap steps in a transaction, and name the anomaly each isolation level allows: dirty read, lost update and write skew."
      - file: 07.05-locks-mvcc-and-compare-and-set.md
        title: "Locks, MVCC and compare-and-set"
        goal: "Fix a lost update with a row lock, with a version check and bounded retries, and with one statement, and choose by how often writers collide."
      - file: 07.06-the-database-scaling-path.md
        title: "The database scaling path"
        goal: "Order the steps of indexes, cache, read replicas, partitioning and special stores, and add each one when its bottleneck appears."
      - file: 07.07-code-compare-and-set-inventory.md
        title: "Code: compare-and-set inventory"
        goal: "Implement a versioned store and a reserveSeats function with a bounded retry loop, and pass the race tests."
      - file: 07.08-challenge-6-the-last-ticket.md
        title: "Challenge 6: the last ticket"
        goal: "Reproduce a lost update in PostgreSQL, fix it with a row lock, compare-and-set and SERIALIZABLE with retries, and measure the cost of each."
      - file: 07.09-quiz.md
        title: "Databases and concurrency"
        goal: "Answer graded scenarios on store choice, indexes, isolation levels, locks and compare-and-set, and the scaling path."
      - file: 07.10-checklist.md
        title: "Checklist and learning log"
        goal: "Write the store and the concurrency control for an inventory service, with its cost and a number to measure, and link your challenge 6 results."
  - dir: 08-replication
    title: "Replication"
    summary: "Copy data for safety and fast reads, and handle what replication lag and failover do to users."
    lessons:
      - file: 08.01-set-the-scene-my-comment-disappeared.md
        title: "Set the scene: my comment disappeared"
        goal: "See a user post a comment, reload, find it missing and post again, and meet the leader and replicas behind it."
      - file: 08.02-single-leader-replication.md
        title: "Single-leader replication"
        goal: "Follow writes from the leader to its followers in log order, send reads to any copy, and explain why followers add room for reads but not for writes."
      - file: 08.03-synchronous-and-asynchronous-replication.md
        title: "Synchronous and asynchronous replication"
        goal: "Trade write latency against the data lost on failover, and choose how many followers must confirm a write."
      - file: 08.04-replication-lag-and-its-anomalies.md
        title: "Replication lag and its anomalies"
        goal: "Reproduce read-your-writes and monotonic reads violations on lagging replicas, and fix each with a routing rule whose cost you can name."
      - file: 08.05-failover-and-split-brain.md
        title: "Failover and split brain"
        goal: "Explain detection, promotion, lost writes and two leaders, and how a fencing number stops the old one."
      - file: 08.06-multi-leader-replication.md
        title: "Multi-leader replication"
        goal: "Explain why two regions writing the same record conflict, how last writer wins loses an edit, and where multi-leader fits."
      - file: 08.07-leaderless-replication-a-first-look.md
        title: "Leaderless replication, a first look"
        goal: "See writes go to many nodes with no leader, and say when R + W is enough for a read to see the newest write."
      - file: 08.08-code-a-read-your-writes-router.md
        title: "Code: a read-your-writes router"
        goal: "Write createRouter: route reads to a replica at or above the user's token, raise the token on reads, cap leader fallback, and quarantine a replica whose position moves backwards."
      - file: 08.09-challenge-7-replicas-and-lag.md
        title: "Challenge 7: replicas and lag"
        goal: "Run a PostgreSQL primary and replica in Docker, induce lag, reproduce the read-your-writes bug, and fix it with log position tokens."
      - file: 08.10-quiz.md
        title: "Replication"
        goal: "Answer graded scenarios on synchronous waits, position tokens, promotion, conflicts between regions and quorums."
      - file: 08.11-checklist.md
        title: "Checklist and learning log"
        goal: "Write a replication plan for a social app: which writes wait for a copy, where each read goes, and what happens when the leader dies."
  - dir: 09-partitioning-and-sharding
    title: "Partitioning and sharding"
    summary: "Split data across machines, keep load even, and survive a celebrity."
    lessons:
      - file: 09.01-set-the-scene-one-table-too-big.md
        title: "Set the scene: one table too big for one machine"
        goal: "See a database run out of disk and write capacity, and why copies do not help but slices do."
      - file: 09.02-range-and-hash-partitioning.md
        title: "Range and hash partitioning"
        goal: "Compare even spread against fast range scans, and see why hash mod N moves most keys when a shard is added."
      - file: 09.03-consistent-hashing-and-virtual-nodes.md
        title: "Consistent hashing and virtual nodes"
        goal: "Explain why adding a node moves few keys, and what virtual nodes fix."
      - file: 09.04-hot-partitions-and-skew.md
        title: "Hot partitions and skew"
        goal: "Find a hot key and fix it with salting, splitting, caching or a shard of its own."
      - file: 09.05-rebalancing-and-request-routing.md
        title: "Rebalancing and request routing"
        goal: "Compare fixed partitions and dynamic splits, move data safely, and choose where the partition map lives."
      - file: 09.06-secondary-indexes-and-cross-shard-queries.md
        title: "Secondary indexes and cross-shard queries"
        goal: "Compare local and global indexes, and see scatter-gather tail latency grow with the shard count."
      - file: 09.07-code-a-consistent-hash-ring.md
        title: "Code: a consistent hash ring"
        goal: "Implement a ring with virtual nodes and pass tests for exact positions, spread and minimal movement."
      - file: 09.08-challenge-8-sharding.md
        title: "Challenge 8: sharding"
        goal: "Shard a key-value store, measure keys moved when a node joins, and find and fix a hot key on real shard servers."
      # 09.09 (Lab: 100 million keys on a hash ring) is skipped until the sandbox exists.
      - file: 09.10-quiz.md
        title: "Partitioning and sharding"
        goal: "Answer graded scenarios on partition keys, keys moved, hot keys, safe rebalancing and queries off the key."
      - file: 09.11-checklist.md
        title: "Checklist and learning log"
        goal: "Write the partition key choice for a product of your own with the hot-key plan."
  - dir: 10-time-clocks-and-ordering
    title: "Time, clocks and ordering"
    summary: "See why 'which happened first?' is hard, and learn every tool from logical clocks to TrueTime."
    lessons:
      - file: 10.01-set-the-scene-which-came-first.md
        title: "Set the scene: which came first?"
        goal: "See two servers' logs disagree about the order of two events."
      - file: 10.02-physical-clocks-lie.md
        title: "Physical clocks lie"
        goal: "Explain drift, time sync, leap seconds, and wall-clock versus monotonic time, and say which clock to use for which job."
      - file: 10.03-lamport-clocks.md
        title: "Lamport clocks"
        goal: "Order events with counters, and say what a Lamport number cannot tell you."
      - file: 10.04-vector-clocks.md
        title: "Vector clocks"
        goal: "Tell 'happened before' from 'concurrent' by comparing two vectors, and keep both versions when neither is newer."
      - file: 10.05-hybrid-logical-clocks.md
        title: "Hybrid logical clocks"
        goal: "Combine wall time and a counter so stamps stay close to real time and still put every effect after its cause."
      - file: 10.06-truetime-time-as-an-interval.md
        title: "TrueTime: time as an interval"
        goal: "Explain why a timestamp is a range, when two ranges overlap, and how commit wait makes the order safe at a cost of about two times the clock uncertainty."
      - file: 10.07-id-generation-at-scale.md
        title: "ID generation at scale"
        goal: "Compare a counter, UUIDv4, UUIDv7 and Snowflake-style IDs, spend the bits of an ID, and handle a clock going backwards."
      - file: 10.08-code-lamport-vector-and-hybrid-clocks.md
        title: "Code: Lamport, vector and hybrid clocks"
        goal: "Implement send, receive and compare for each of the three clocks and pass the tests."
      - file: 10.09-challenge-9-clocks.md
        title: "Challenge 9: clocks"
        goal: "Simulate drifting clocks, run your three clocks on a chat workload and count what each gets right, and build a Snowflake ID generator that survives a clock step back."
      - file: 10.10-quiz.md
        title: "Time, clocks and ordering"
        goal: "Answer graded scenarios on drift, logical, vector and hybrid clocks, IDs and commit wait."
      - file: 10.11-checklist.md
        title: "Checklist and learning log"
        goal: "Write how you would order two writes 1 ms apart on different servers, what it costs, and link your challenge 9 results."
