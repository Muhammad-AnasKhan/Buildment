# track: soft-skills
slug: ownership
title: "Ownership, Initiative & Adaptability"
description: "Learn to own outcomes, take initiative without waiting to be told, work through unclear tasks, finish what you start, learn on your own, and recover when plans change. Practice uses ambiguous assignments, changing requirements and your own improvement plan."
projectGoal: "Write a personal improvement plan with goals, habits and review dates, and share a progress check with a mentor."
difficulty: Beginner
estimatedHours: 10
category: soft-skills
modules:
  - dir: 01-ownership-and-accountability
    title: "Ownership and accountability"
    summary: "Care about the result, not only the task, and own your mistakes."
    lessons:
      - file: 01.01-set-the-scene.md
        title: "Set the scene"
        goal: "Show why ownership is what makes remote workers trusted, and what the course practices."
      - file: 01.02-own-the-outcome.md
        title: "Own the outcome, not just the task"
        goal: "Check that the work solves the real problem, not only that the ticket is closed."
      - file: 01.03-admitting-mistakes.md
        title: "Admitting mistakes"
        goal: "Report a mistake early with what happened, the impact and the fix."
      - file: 01.04-quiz.md
        title: "Ownership"
        goal: "Graded scenarios on ownership and accountability."
      - file: 01.05-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: reflect on a task you owned fully or did not."
  - dir: 02-taking-initiative
    title: "Taking initiative"
    summary: "Notice gaps, propose solutions instead of only reporting problems, and act within your role."
    lessons:
      - file: 02.01-set-the-scene.md
        title: "Set the scene"
        goal: "Show the difference between waiting for instructions and taking initiative."
      - file: 02.02-spot-the-gap.md
        title: "Spot the gap"
        goal: "Notice problems or opportunities others miss, and check if they matter."
      - file: 02.03-propose-dont-just-report.md
        title: "Propose, don't just report"
        goal: "Bring a problem with a suggested next step, and know when to ask first."
      - file: 02.04-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: an initiative challenge with a written proposal."
  - dir: 03-working-with-ambiguity
    title: "Working with ambiguity"
    summary: "Clarify unclear assignments and make progress with stated assumptions."
    lessons:
      - file: 03.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce a vague assignment from a client and why it is common."
      - file: 03.02-clarify-the-goal.md
        title: "Clarify the goal"
        goal: "Ask what success looks like, who it is for and what is out of scope."
      - file: 03.03-progress-with-assumptions.md
        title: "Make progress with assumptions"
        goal: "Write down assumptions, share them, and keep moving while you wait for answers."
      - file: 03.04-quiz.md
        title: "Ambiguity"
        goal: "Graded scenarios on clarifying and handling unclear tasks."
      - file: 03.05-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: turn an ambiguous assignment into clear goals and assumptions."
  - dir: 04-finishing-what-you-start
    title: "Finishing what you start"
    summary: "Break big work into steps, define done, and get past the last ten percent."
    lessons:
      - file: 04.01-set-the-scene.md
        title: "Set the scene"
        goal: "Show why unfinished work has little value and why finishing is hard."
      - file: 04.02-break-it-down.md
        title: "Break it down"
        goal: "Split a large task into small steps you can finish in a day or less."
      - file: 04.03-done-means-done.md
        title: "Done means done"
        goal: "Agree what done means, and finish testing, documentation and handoff."
      - file: 04.04-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: break down one unfinished task of your own and finish the first step."
  - dir: 05-learning-on-your-own
    title: "Learning on your own"
    summary: "Learn new tools and topics independently and get unstuck without waiting."
    lessons:
      - file: 05.01-set-the-scene.md
        title: "Set the scene"
        goal: "Explain why independent learning is a core remote-work skill."
      - file: 05.02-learning-a-new-tool.md
        title: "Learning a new tool"
        goal: "Use official docs, a tiny practice project and notes to learn a tool quickly."
      - file: 05.03-getting-unstuck.md
        title: "Getting unstuck"
        goal: "Try for a set time, search well, then ask a clear question with what you tried."
      - file: 05.04-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: a short learning plan for one new tool or topic."
  - dir: 06-change-and-resilience
    title: "Change and resilience"
    summary: "Respond calmly when requirements change, and recover from setbacks."
    lessons:
      - file: 06.01-set-the-scene.md
        title: "Set the scene"
        goal: "Show that change is normal in projects, and that how you respond is a choice."
      - file: 06.02-when-requirements-change.md
        title: "When requirements change"
        goal: "Understand the reason, check the impact on time and cost, and agree a new plan."
      - file: 06.03-setbacks-and-recovery.md
        title: "Setbacks and recovery"
        goal: "Recover from setbacks with small next steps and support, without blaming yourself."
      - file: 06.04-quiz.md
        title: "Change"
        goal: "Graded scenarios on responding to changing requirements."
      - file: 06.05-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: reflect on a change or setback and what helped you adapt."
  - dir: 07-capstone
    title: "Capstone: your improvement plan"
    summary: "Write a personal improvement plan and share a progress check."
    lessons:
      - file: 07.01-set-the-scene.md
        title: "Set the scene"
        goal: "Explain the capstone: a realistic plan you will actually follow."
      - file: 07.02-write-your-improvement-plan.md
        title: "Write your improvement plan"
        goal: "Write goals, habits, obstacles and review dates, and submit the plan for mentor review."
      - file: 07.03-checklist.md
        title: "Checklist and learning log"
        goal: "Final gate: commit to your first review date and the first habit."
