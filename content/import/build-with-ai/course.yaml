slug: build-with-ai
title: "Learn and Build with AI: An Enabler, Not a Replacement"
description: "AI will not do your career for you, and it will not take it away. Learn to use AI tools as an enabler: see what AI does not know and which calls stay yours, learn a topic deeply from several angles with AI, turn sources into audio you can learn from on the go, run small daily labs and post them to GitHub, plan a strong project over six months that you fully understand, and share your progress honestly."
projectGoal: "Build the start of a strong project you understand: a six-month plan with a weekly learning plan, a GitHub lab log with at least ten daily labs, structured notes in your own words, and one honest public write-up. Or work from a provided case. Then walk a mentor through it in five minutes and explain one part without notes."
difficulty: Beginner
estimatedHours: 21
category: tech
modules:
  - dir: 01-ai-as-an-enabler
    title: "AI as an enabler, not a replacement"
    summary: "Look past the two loud stories about AI. See what an AI tool does not know, which calls a person must make and own, and why the scarce skill is now building a strong project you understand."
    lessons:
      - file: 01.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce the course through three fellows: one who hands everything to AI, one who refuses it, and one who uses it as an enabler."
      - file: 01.02-what-ai-does-not-know.md
        title: "What AI does not know"
        goal: "Name what an AI tool is missing in a task: your context, your data, local and recent facts, and the obvious things nobody wrote down."
      - file: 01.03-you-make-the-call.md
        title: "You make the call"
        goal: "Separate what AI can propose from what a person must decide, check and own."
      - file: 01.04-help-or-harm.md
        title: "AI can help or harm your learning"
        goal: "Explain what studies found: AI that hands out answers can weaken learning, and AI that makes you think can help."
      - file: 01.05-plenty-of-ai-few-strong-projects.md
        title: "Plenty of AI, few strong projects"
        goal: "Explain why building fast is no longer rare, and why a project you understand and can defend is."
      - file: 01.06-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: one task split into what AI can help with and the calls that stay yours."
  - dir: 02-your-ai-toolkit
    title: "Your AI toolkit and its rules"
    summary: "Pick AI tools by the job they do, check their free access and terms yourself, keep your work in files you own, and decide what you never paste or upload."
    lessons:
      - file: 02.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce the toolkit through a fellow who lost a month of work when a free tool changed, and a freelancer who pasted a client's data."
      - file: 02.02-before-you-paste.md
        title: "Before you paste: privacy and checking"
        goal: "Decide what never goes into an AI tool, find its training setting, and check AI output before you use it."
      - file: 02.03-jobs-not-tools.md
        title: "Jobs, not tools"
        goal: "Match a task to the kind of tool that does that job, with two examples for each, and check that a tool opens for you, at your age, on your device."
      - file: 02.04-habits-that-outlast-tools.md
        title: "Habits that outlast any tool"
        goal: "Keep work in files you own, save what worked, and have a fallback for when a tool is down, blocked, renamed or out of free use."
      - file: 02.05-quiz.md
        title: "Your AI toolkit"
        goal: "Graded scenarios on choosing tools, owning your work, privacy and checking AI output."
      - file: 02.06-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: your own toolkit page with two tools for each job, checked and dated, a fallback, where your work is saved, and your privacy rules."
  - dir: 03-learn-deeply-with-ai
    title: "Learn deeply with AI"
    summary: "Stop mistaking a clear AI explanation for learning. Test yourself, attack a topic from five angles, make the AI quiz you on a schedule, learn from sources by listening first and reading after, and keep notes you can use months later."
    lessons:
      - file: 03.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce deep learning through a fellow who understood every AI explanation and still failed the test."
      - file: 03.02-the-fluency-trap.md
        title: "The fluency trap"
        goal: "Explain why reading a clear explanation feels like learning, and use recall from memory to find the gaps."
      - file: 03.03-one-topic-five-angles.md
        title: "One topic, five angles"
        goal: "Learn one topic five ways with AI: a plain explanation, a picture, a worked example, a failure case, and building or teaching it."
      - file: 03.04-make-the-ai-quiz-you.md
        title: "Make the AI quiz you"
        goal: "Ask an AI to question you instead of telling you, mix two topics in one practice, and space your reviews over days."
      - file: 03.05-listen-then-read.md
        title: "Listen to meet it, read to learn it"
        goal: "Turn trusted sources into an audio overview to listen to while you walk or wait, then read the sources and check what the audio got wrong."
      - file: 03.06-notes-you-own.md
        title: "Notes you own, in your own words"
        goal: "Keep structured notes in files you own: one notebook per project, a section per area, a page per topic, written in your own words."
      - file: 03.07-quiz.md
        title: "Learning with AI"
        goal: "Graded scenarios on recall, angles, AI tutoring, spacing, sources and notes, including AI output to check."
      - file: 03.08-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: one topic learned from five angles, with a recall test and a notes page."
  - dir: 04-daily-labs
    title: "Daily labs"
    summary: "Study a little, build something small, watch it run, break one part on purpose, and write it down. Plan each lab with an AI chat, keep the scope yours, and post the log to GitHub."
    lessons:
      - file: 04.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce daily labs through two fellows learning system design: one who only watched videos, and one who ran a small lab every day."
      - file: 04.02-the-shape-of-a-daily-lab.md
        title: "The shape of a daily lab"
        goal: "Plan a lab in four parts that fits about 30 to 45 minutes: study, build, break, write."
      - file: 04.03-plan-a-lab-with-ai.md
        title: "Plan a lab with an AI chat"
        goal: "Ask an AI chat for a structured lab plan, cut it to size, and check every command and package before you run or install it."
      - file: 04.04-watch-it-run-then-break-it.md
        title: "Watch it run, then break it"
        goal: "Predict what happens when one part of a small URL shortener stops, then stop it and explain the result."
      - file: 04.05-the-lab-log-on-github.md
        title: "The lab log on GitHub"
        goal: "Keep a lab log in a GitHub repository: one entry per day, clear commit messages, a check before every push, and what AI helped with."
      - file: 04.06-quiz.md
        title: "Daily labs"
        goal: "Graded scenarios on lab scope, AI lab plans, breaking things on purpose and lab logs."
      - file: 04.07-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: lab day 1 planned, run and logged on GitHub, or the provided lab log reviewed."
  - dir: 05-a-project-worth-six-months
    title: "A project worth six months"
    summary: "Strong projects still take months, because most of the time goes into learning. Plan six months one area at a time, ask AI what to learn and check it, slow down for trade-offs, and learn from open-source projects within their licences."
    lessons:
      - file: 05.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce the six-month project through a fellow whose weekend app could not survive one interview question."
      - file: 05.02-why-strong-projects-take-months.md
        title: "Why strong projects still take months"
        goal: "Work out how many hours a six-month plan gives, and why a large share of them goes to learning."
      - file: 05.03-a-weekly-plan.md
        title: "A weekly plan, one area at a time"
        goal: "Plan the weeks so each one adds one new area, with videos, books and articles an AI suggested and you checked exist."
      - file: 05.04-slow-down-for-trade-offs.md
        title: "Slow down for trade-offs"
        goal: "Compare two options for a real project decision, and explain any AI-written part before you keep it."
      - file: 05.05-learn-from-open-source.md
        title: "Learn from open source"
        goal: "Find an open-source project worth studying, read it in a set order, and reuse code only within its licence and with credit."
      - file: 05.06-quiz.md
        title: "Planning a strong project"
        goal: "Graded scenarios on hours, weekly areas, checking AI-suggested resources, trade-offs and licences."
      - file: 05.07-checklist.md
        title: "Checklist and learning log"
        goal: "Gate: the first month of your six-month plan, week by week."
  - dir: 06-share-the-work
    title: "Share the work honestly, and capstone"
    summary: "Turn a week of progress into an honest write-up, adapt it for more than one platform, say what AI helped with, then bring the whole course together in the capstone."
    lessons:
      - file: 06.01-set-the-scene.md
        title: "Set the scene"
        goal: "Introduce sharing the work through a fellow whose quiet GitHub repository nobody saw, and one whose post was mostly AI."
      - file: 06.02-from-commits-to-an-article.md
        title: "From a week of commits to an article"
        goal: "Turn a week of lab logs into a short article in your own voice, then adapt it for two other platforms."
      - file: 06.03-say-when-ai-helped.md
        title: "Say when AI helped"
        goal: "Write an honest line about how AI helped, and know the rules of the places you post to and work for."
      - file: 06.04-mixed-review.md
        title: "Mixed review: which habit first?"
        goal: "Choose the right habit for fresh cases from every module."
      - file: 06.05-capstone-your-project-start.md
        title: "Capstone: the start of a strong project"
        goal: "Hand in a six-month plan, a weekly learning plan, a GitHub lab log with ten lab days, a notes page and an honest public write-up, or the provided case."
      - file: 06.06-checklist.md
        title: "Course checklist and your AI-as-enabler toolkit"
        goal: "Gate: final checks, your toolkit of habits, and a look back at your first gate."
