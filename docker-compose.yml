services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buildment
      POSTGRES_PASSWORD: buildment
      POSTGRES_DB: buildment
    ports:
      - "5432:5432"
    volumes:
      - buildment-postgres-data:/var/lib/postgresql/data

volumes:
  buildment-postgres-data:
