<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ticketline request path</title>
  <desc id="desc">A browser request goes through the API before reaching Postgres. Only the API owns business rules and database credentials.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <text x="32" y="43" fill="#64748b" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TICKETLINE · REQUEST PATH</text>
  <text x="32" y="78" fill="#0f172a" font-family="Arial, sans-serif" font-size="27" font-weight="700">One route, one trust boundary</text>
  <text x="32" y="105" fill="#475569" font-family="Arial, sans-serif" font-size="15">The browser asks. The API decides. Postgres stores the result.</text>
  <g font-family="Arial, sans-serif">
    <rect x="32" y="145" width="196" height="162" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="61" cy="178" r="15" fill="#e2e8f0"/><text x="56" y="183" fill="#334155" font-size="14" font-weight="700">1</text>
    <text x="48" y="221" fill="#0f172a" font-size="21" font-weight="700">Web app</text>
    <text x="48" y="247" fill="#475569" font-size="14">Displays events</text>
    <text x="48" y="269" fill="#475569" font-size="14">Sends a request</text>
    <path d="M241 226h25" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><path d="m259 219 8 7-8 7" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="276" y="145" width="196" height="162" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <circle cx="305" cy="178" r="15" fill="#4f46e5"/><text x="300" y="183" fill="#fff" font-size="14" font-weight="700">2</text>
    <text x="292" y="221" fill="#1e1b4b" font-size="21" font-weight="700">API</text>
    <text x="292" y="247" fill="#3730a3" font-size="14">Checks access</text>
    <text x="292" y="269" fill="#3730a3" font-size="14">Enforces capacity</text>
    <path d="M485 226h25" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/><path d="m503 219 8 7-8 7" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="520" y="145" width="168" height="162" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="549" cy="178" r="15" fill="#e2e8f0"/><text x="544" y="183" fill="#334155" font-size="14" font-weight="700">3</text>
    <text x="536" y="221" fill="#0f172a" font-size="21" font-weight="700">Postgres</text>
    <text x="536" y="247" fill="#475569" font-size="14">Stores events</text>
    <text x="536" y="269" fill="#475569" font-size="14">Stores inventory</text>
    <rect x="32" y="338" width="656" height="51" rx="10" fill="#e0e7ff"/>
    <circle cx="55" cy="363" r="5" fill="#4f46e5"/>
    <text x="72" y="368" fill="#312e81" font-size="14" font-weight="700">Boundary:</text>
    <text x="154" y="368" fill="#312e81" font-size="14">secrets and database access stay behind the API.</text>
  </g>
</svg>
