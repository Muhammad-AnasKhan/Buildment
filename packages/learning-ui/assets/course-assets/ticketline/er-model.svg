<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 950" role="img" aria-labelledby="er-title er-desc">
  <title id="er-title">Ticketline Week 1 data model</title>
  <desc id="er-desc">A User owns many Events and has many Sessions and EmailVerificationTokens. Each Event has many TicketTypes. TicketType keeps sold plus held quantity within capacity.</desc>
  <rect width="780" height="950" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">Week 1 data model</text>
    <text x="40" y="77" font-size="16" fill="#475569">Five tables establish ownership, identity, and ticket capacity.</text>

    <rect x="40" y="135" width="315" height="220" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="170" font-size="20" font-weight="700" fill="#0f172a">User</text>
    <text x="60" y="205" font-size="16" fill="#334155">id · email · name</text>
    <text x="60" y="232" font-size="16" fill="#334155">password_hash</text>
    <text x="60" y="259" font-size="16" fill="#334155">role · email_verified_at</text>
    <line x1="60" y1="283" x2="335" y2="283" stroke="#cbd5e1"/>
    <text x="60" y="318" font-size="15" font-weight="600" fill="#475569">Unique email</text>

    <rect x="425" y="135" width="315" height="245" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="445" y="170" font-size="20" font-weight="700" fill="#0f172a">Event</text>
    <text x="445" y="205" font-size="16" fill="#334155">id · organizer_id</text>
    <text x="445" y="232" font-size="16" fill="#334155">slug · title · status</text>
    <text x="445" y="259" font-size="16" fill="#334155">venue · timezone</text>
    <text x="445" y="286" font-size="16" fill="#334155">starts_at · ends_at</text>
    <text x="445" y="313" font-size="16" fill="#334155">sales window · cover image</text>
    <line x1="445" y1="333" x2="720" y2="333" stroke="#cbd5e1"/>
    <text x="445" y="359" font-size="15" font-weight="600" fill="#475569">Unique slug · organizer owned</text>

    <rect x="40" y="470" width="315" height="155" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="505" font-size="20" font-weight="700" fill="#0f172a">Session</text>
    <text x="60" y="540" font-size="16" fill="#334155">id · token_hash</text>
    <text x="60" y="567" font-size="16" fill="#334155">user_id · expires_at</text>
    <text x="60" y="601" font-size="15" font-weight="600" fill="#475569">Unique token hash</text>

    <rect x="425" y="490" width="315" height="320" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="445" y="525" font-size="20" font-weight="700" fill="#1e3a8a">TicketType</text>
    <text x="445" y="560" font-size="16" fill="#334155">id · event_id</text>
    <text x="445" y="587" font-size="16" fill="#334155">name · description</text>
    <text x="445" y="614" font-size="16" fill="#334155">price_cents · currency</text>
    <text x="445" y="641" font-size="16" fill="#334155">capacity · max_per_order</text>
    <text x="445" y="668" font-size="16" fill="#334155">sold_quantity</text>
    <text x="445" y="695" font-size="16" fill="#334155">held_quantity</text>
    <text x="445" y="722" font-size="16" fill="#334155">sales window</text>
    <line x1="445" y1="746" x2="720" y2="746" stroke="#93c5fd"/>
    <text x="445" y="780" font-size="15" font-weight="700" fill="#1d4ed8">sold + held ≤ capacity</text>

    <rect x="40" y="715" width="315" height="175" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="60" y="750" font-size="19" font-weight="700" fill="#0f172a">EmailVerificationToken</text>
    <text x="60" y="785" font-size="16" fill="#334155">id · token_hash</text>
    <text x="60" y="812" font-size="16" fill="#334155">user_id · expires_at</text>
    <text x="60" y="839" font-size="16" fill="#334155">used_at</text>
    <text x="60" y="869" font-size="15" font-weight="600" fill="#475569">Single use</text>

    <g stroke="#64748b" stroke-width="2" fill="none">
      <path d="M355 220 H425"/>
      <path d="M582 380 V490"/>
      <path d="M40 300 H20 V802 H40"/>
      <path d="M20 548 H40"/>
    </g>
    <g font-size="14" font-weight="600" fill="#475569">
      <text x="366" y="209">1 → N</text>
      <text x="594" y="442">1 → N</text>
      <text x="28" y="448">1 → N</text>
      <text x="28" y="696">1 → N</text>
    </g>
  </g>
</svg>
