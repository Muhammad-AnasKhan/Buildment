<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Ticket capacity invariant</title>
  <desc id="desc">A ticket type has capacity 100, sold quantity 72, held quantity 8, and 20 available. The API keeps sold plus held at or below capacity.</desc>
  <rect width="720" height="420" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif">
    <text x="32" y="43" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1.5">TICKETLINE · INVENTORY RULE</text>
    <text x="32" y="78" fill="#0f172a" font-size="27" font-weight="700">Capacity is a promise</text>
    <text x="32" y="105" fill="#475569" font-size="15">Every hold and purchase must preserve one invariant.</text>
    <rect x="32" y="141" width="656" height="105" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="52" y="175" fill="#64748b" font-size="13" font-weight="700">TICKET TYPE · GENERAL ADMISSION</text>
    <text x="52" y="215" fill="#0f172a" font-size="25" font-weight="700">100 seats</text>
    <rect x="245" y="184" width="305" height="22" rx="11" fill="#e2e8f0"/>
    <path d="M256 184h209v22H256a11 11 0 0 1-11-11 11 11 0 0 1 11-11Z" fill="#4f46e5"/>
    <path d="M465 184h23v22h-23Z" fill="#a5b4fc"/>
    <text x="566" y="200" fill="#334155" font-size="15" font-weight="700">20 free</text>
    <rect x="32" y="271" width="202" height="81" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="51" y="302" fill="#4338ca" font-size="14">Sold</text><text x="51" y="332" fill="#1e1b4b" font-size="25" font-weight="700">72</text>
    <text x="249" y="321" fill="#64748b" font-size="23">+</text>
    <rect x="280" y="271" width="176" height="81" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="299" y="302" fill="#4338ca" font-size="14">Held</text><text x="299" y="332" fill="#1e1b4b" font-size="25" font-weight="700">8</text>
    <text x="472" y="321" fill="#64748b" font-size="23">≤</text>
    <rect x="505" y="271" width="183" height="81" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="524" y="302" fill="#475569" font-size="14">Capacity</text><text x="524" y="332" fill="#0f172a" font-size="25" font-weight="700">100</text>
    <text x="32" y="387" fill="#475569" font-size="14">The API checks this rule when changing inventory, including concurrent requests.</text>
  </g>
</svg>
